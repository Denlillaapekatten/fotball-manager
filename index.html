<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotball Manager — Karriere</title>
<style>
  :root{--bg:#0b3d2e;--bg2:#0e4a37;--panel:#10261d;--line:#1c4d3a;--text:#eaf5ee;
    --muted:#9fc4b2;--gold:#f4c542;--accent:#3ddc84;--bad:#ff6b6b;--blue:#7fb0ff;--orange:#ffae57}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 60%);color:var(--text);min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:16px 16px 60px}
  h1{font-size:28px;margin:6px 0 2px}
  .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
  h2{font-size:19px;margin:16px 0 10px;border-left:4px solid var(--accent);padding-left:10px}
  h3{font-size:15px;margin:0 0 8px;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px #0006}
  button{background:var(--accent);color:#06301d;border:none;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;transition:.12s}
  button:hover{filter:brightness(1.08);transform:translateY(-1px)}
  button.sec{background:#1d4d3a;color:var(--text);border:1px solid var(--line)}
  button.gold{background:var(--gold);color:#3a2c00}
  button.tiny{padding:4px 9px;font-size:12px;border-radius:7px}
  button.red{background:#5a2222;color:#ffd0d0;border:1px solid #7a3333}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
  select{background:#0c2419;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:6px 8px;text-align:left}
  th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tbody tr{border-bottom:1px solid #ffffff0d}
  tbody tr.me{background:#3ddc8418}
  td.c,th.c{text-align:center}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700;min-width:30px;text-align:center}
  .pill.gk{background:#b8860b40;color:#f4c542}.pill.df{background:#2f6dd040;color:#7fb0ff}
  .pill.mf{background:#2bb35540;color:#7fffb0}.pill.fw{background:#d0432f40;color:#ff9a8a}
  .ovr{font-weight:800}
  .teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .teamcard{background:#0c2419;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.12s}
  .teamcard:hover{border-color:var(--accent);transform:translateY(-2px)}
  .teamcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .crest{font-size:24px}.star{color:var(--gold)}
  .ratebar{height:6px;background:#0c2419;border-radius:4px;overflow:hidden;margin-top:6px}
  .ratebar>i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#179043)}
  .stat{background:#0c2419;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1;min-width:120px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:20px;font-weight:800;margin-top:2px}
  .stat .v.good{color:var(--accent)}.stat .v.gold{color:var(--gold)}.stat .v.blue{color:var(--blue)}
  .nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .scoreboard{display:flex;align-items:center;justify-content:center;gap:16px;font-size:22px;font-weight:800;padding:8px 0}
  .sb-team{flex:1;text-align:center}.sb-team.h{text-align:right}
  .sb-score{background:#06301d;border-radius:10px;padding:6px 16px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
  .clock{text-align:center;color:var(--gold);font-weight:700;letter-spacing:1px;margin:4px 0 10px}
  .commentary{background:#0c2419;border:1px solid var(--line);border-radius:10px;height:280px;overflow-y:auto;padding:10px 12px;font-size:14px;line-height:1.55}
  .ev{margin:3px 0;padding:3px 8px;border-radius:6px;animation:fade .3s}
  .ev.goal{background:#3ddc8422;font-weight:700;color:var(--accent)}
  .ev.chance{color:#ffe08a}.ev.big{color:#fff}.ev.sys{color:var(--muted);font-style:italic}
  .ev.inj{color:var(--orange)}
  .ev.card{color:#ffd24d}.ev.cardred{color:var(--bad);font-weight:700}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .fixtures{display:grid;gap:6px}
  .fx{display:flex;align-items:center;gap:8px;background:#0c2419;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
  .fx .t{flex:1}.fx .t.h{text-align:right}
  .fx .res{background:#06301d;border-radius:6px;padding:3px 10px;font-weight:700;min-width:54px;text-align:center}
  .fx.userfx{border-color:var(--gold)}
  .tag{font-size:11px;background:var(--gold);color:#3a2c00;padding:1px 7px;border-radius:10px;font-weight:700}
  .muted{color:var(--muted)}.center{text-align:center}
  .big-num{font-size:34px;font-weight:800;color:var(--gold)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{background:#1d4d3a;color:var(--text);border:1px solid var(--line)}
  .tabs button.on{background:var(--accent);color:#06301d}
  .scroll{overflow-x:auto}
  .note{background:#0c2419;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13.5px;margin:8px 0}
  .ageY{color:var(--accent)}.ageO{color:var(--bad)}
  .formup{color:var(--accent)}.formdn{color:var(--bad)}
  .inj{color:var(--orange);font-weight:700}
  .promo{border-left:3px solid var(--accent)}.releg{border-left:3px solid var(--bad)}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
  .warn{color:var(--bad);font-weight:700}.ok{color:var(--accent);font-weight:700}
</style>
</head>

 p.value=playerValue(p);p.wage=wageFor(p.value);return p;}

/* ----- XI ----- */
function bestXI(squad,formation){
 const f=FORMATIONS[formation];
 const s=pos=>squad.filter(p=>p.pos===pos&&fit(p)).sort((a,b)=>eff(b)-eff(a));
 return [...s("GK").slice(0,1),...s("DF").slice(0,f.DF),...s("MF").slice(0,f.MF),...s("FW").slice(0,f.FW)];}
function xiValid(team){
 const f=FORMATIONS[team.formation],sel=team.squad.filter(p=>p.inXI&&fit(p));
 const c=t=>sel.filter(p=>p.pos===t).length;
 return sel.length===11&&c("GK")===1&&c("DF")===f.DF&&c("MF")===f.MF&&c("FW")===f.FW;}
function activeXI(team){
 if(team.isUser&&xiValid(team))return team.squad.filter(p=>p.inXI&&fit(p));
 const xi=bestXI(team.squad,team.formation),ids=new Set(xi.map(p=>p.id));
 team.squad.forEach(p=>p.inXI=ids.has(p.id));return xi;}
function autoPickXI(team){const xi=bestXI(team.squad,team.formation),ids=new Set(xi.map(p=>p.id));
 team.squad.forEach(p=>p.inXI=ids.has(p.id));ensureClubCaptain(team);}
function ensureClubCaptain(team){
 let cap=team.captainId&&team.squad.find(p=>p.id===team.captainId&&fit(p));
 if(!cap){cap=team.squad.filter(fit).sort((a,b)=>b.rating-a.rating)[0]||team.squad[0];team.captainId=cap?cap.id:null;}
 team.squad.forEach(p=>p.captain=(p.id===team.captainId));}
window.setClubCaptain=id=>{const t=userTeam();t.captainId=(t.captainId===id?null:id);ensureClubCaptain(t);save();renderSquad();};
const wageTotal=team=>team.squad.reduce((s,p)=>s+p.wage,0);
const squadAvg=team=>{const x=bestXI(team.squad,"4-4-2");return x.length?Math.round(x.reduce((s,p)=>s+p.rating,0)/x.length):50;};

 formation:"4-4-2",mentality:"Balansert",isUser:false,manager:null,pts:0,w:0,d:0,l:0,gf:0,ga:0};}

function buildAllSquads(teams){
 const fjord=teams.find(t=>t.name==="Fjord United");
 const byPos={GK:[],DF:[],MF:[],FW:[]};
 REAL_PLAYERS.forEach(e=>byPos[e[1]].push(e));
 FJORD_PLAYERS.forEach(nm=>{for(const pos in byPos){const idx=byPos[pos].findIndex(e=>e[0]===nm);
   if(idx>=0){const e=byPos[pos].splice(idx,1)[0];const p=makeRealPlayer(e);p.contract=rint(3,5);fjord.squad.push(p);break;}}});
 Object.values(byPos).forEach(a=>a.sort((x,y)=>y[2]-x[2]));
 const ordered=[...teams].sort((a,b)=>b.base-a.base);
 const comp={GK:2,DF:7,MF:6,FW:5},idx={GK:0,DF:0,MF:0,FW:0};
 for(const pos of ["GK","DF","MF","FW"]){
  for(let slot=0;slot<comp[pos];slot++){
   for(const team of ordered){
    if(team.squad.filter(p=>p.pos===pos).length>=comp[pos])continue;
    let p;
    if(idx[pos]<byPos[pos].length)p=makeRealPlayer(byPos[pos][idx[pos]++]);
    else p=makePlayer(pos,clamp(team.base+rint(-7,5),38,90));
    team.squad.push(p);
   }}}
}

const MONTHS=["aug.","sep.","okt.","nov.","des.","jan.","feb.","mar.","apr.","mai","jun."];
function dateStr(day){const dd=((day-1)%30)+1,mi=Math.floor((day-1)/30)%MONTHS.length;return dd+". "+MONTHS[mi];}
function buildSchedule(){
 const ev=[];
 for(let r=0;r<ROUNDS_PER_SEASON;r++)ev.push({day:(r+1)*7,type:'league',round:r});
 [2,5,8,11,14].forEach(w=>ev.push({day:w*7-3,type:'cup'}));

 [13,30,48,69,86].forEach(d=>ev.push({day:d,type:'uttak'}));
 ev.sort((a,b)=>a.day-b.day);

function buildLeagues(teams){const fx={};
 COUNTRY_DEFS.forEach((cd,ci)=>{fx[ci]={};
  for(let d=0;d<3;d++){const ids=teams.filter(t=>t.country===ci&&t.div===d).map(t=>t.id);fx[ci][d]=makeFixtures(ids);}});
 return fx;}
function makeFixtures(ids){
 const n=ids.length,arr=[...Array(n).keys()],rounds=[];
 for(let r=0;r<n-1;r++){const g=[];
  for(let i=0;i<n/2;i++){const h=arr[i],a=arr[n-1-i];g.push(r%2===0?[h,a]:[a,h]);}
  rounds.push(g);arr.splice(1,0,arr.pop());}
 const second=rounds.map(rd=>rd.map(([h,a])=>[a,h]));
 return [...rounds,...second].map(g=>g.map(([h,a])=>({h:ids[h],a:ids[a],played:false,hs:0,as:0})));}

 else{if(expected<=1){target=1;text="Vinn serien!";}
  else if(expected<=3){target=3;text="Kjemp om medalje — topp 3.";}

/* ===================== MATCH ENGINE ===================== */
function managerBonus(team){return team.manager?clamp((team.manager.rating-78)*0.15,-3,4):0;}
function strength(team){
 const xi=activeXI(team),f=FORMATIONS[team.formation],m=MENTALITY[team.mentality];
 const avg=a=>a.length?a.reduce((s,p)=>s+eff(p),0)/a.length:48;
 const gk=avg(xi.filter(p=>p.pos==="GK")),df=avg(xi.filter(p=>p.pos==="DF")),
   mf=avg(xi.filter(p=>p.pos==="MF")),fw=avg(xi.filter(p=>p.pos==="FW"));
 const mb=managerBonus(team);
 return{attack:fw*.6+mf*.4+f.atk+m.atk+mb,defense:df*.6+gk*.4+f.def+m.def+mb,risk:m.risk,xi};}
function simulate(home,away){
 const H=strength(home),A=strength(away),events=[];let hs=0,as=0;const ha=4;
 for(let min=1;min<=90;min++){
  if(Math.random()<0.10){
   const hP=(H.attack+ha)*H.risk,aP=A.attack*A.risk,tot=hP+aP,hm=Math.random()<hP/tot;
   const atkT=hm?home:away,defT=hm?away:home,aS=hm?H:A,dS=hm?A:H;
   const sc=pick(aS.xi.filter(p=>p.pos!=="GK"))||aS.xi[0];if(!sc)continue;
   const q=(aS.attack+eff(sc))/2+(hm?ha:0),conv=clamp(.30+(q-dS.defense)/120,.05,.62);
   if(Math.random()<conv){if(hm)hs++;else as++;sc.goals=(sc.goals||0)+1;sc.clubGoals=(sc.clubGoals||0)+1;
    let asst=null;if(Math.random()<0.6){const mates=aS.xi.filter(p=>p!==sc&&p.pos!=="GK");if(mates.length){asst=pick(mates);asst.clubAssists=(asst.clubAssists||0)+1;}}
    events.push({min,type:"goal",home:hm,sid:sc.id,aid:asst?asst.id:null,text:`⚽ MÅL! ${sc.name} scorer${asst?` (assist: ${asst.name})`:''} for ${atkT.name}!`});}
   else events.push({min,type:"chance",home:hm,text:"🎯 "+pick([
    `${sc.name} skyter like utenfor!`,`Stor sjanse — ${defT.name}s keeper redder!`,
    `${sc.name} alene med keeper... reddet!`,`${sc.name} treffer stolpen!`,
    `Frispark til ${atkT.name} — over mål.`])});
  }
  if(Math.random()<0.022){const ch=Math.random()<0.5,tS=ch?H:A,tT=ch?home:away,pls=tS.xi.filter(p=>p.pos!=="GK"),pl=pls.length?pick(pls):tS.xi[0];
   if(pl){if(Math.random()<0.12){pl.clubRc=(pl.clubRc||0)+1;events.push({min,type:"card",home:ch,pid:pl.id,red:true,text:`🟥 Rødt kort! ${pl.name} (${tT.name}).`});}
    else{pl.clubYc=(pl.clubYc||0)+1;events.push({min,type:"card",home:ch,pid:pl.id,red:false,text:`🟨 Gult kort til ${pl.name} (${tT.name}).`});}}}
 }
 H.xi.forEach(p=>{if(p&&p.id!=null)p.apps=(p.apps||0)+1;});
 A.xi.forEach(p=>{if(p&&p.id!=null)p.apps=(p.apps||0)+1;});
 return{hs,as,events};}
function applyResult(fx,hs,as){
 fx.played=true;fx.hs=hs;fx.as=as;
 const h=G.teams[fx.h],a=G.teams[fx.a];
 h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
 if(hs>as){h.w++;a.l++;h.pts+=3;}else if(hs<as){a.w++;h.l++;a.pts+=3;}else{h.d++;a.d++;h.pts++;a.pts++;}}
function maybeInjure(team){
 const cand=team.squad.filter(p=>p.inXI&&fit(p));if(!cand.length)return;
 const p=pick(cand),tired=(p.energy==null?100:p.energy)<45;
 if(Math.random()<(tired?0.13:0.06)){p.injury=rint(2,6);p.inXI=false;
  if(team.isUser)G.news.push(`🤕 ${p.name} ble skadet og er ute i ${p.injury} runder.`);}}
function tickEffects(){G.teams.forEach(t=>t.squad.forEach(p=>{if(p.injury>0)p.injury--;p.form=clamp((p.form||0)+rint(-1,1),-3,3);}));}
function recoverEnergy(days){const r=days*8;G.teams.forEach(t=>t.squad.forEach(p=>{p.energy=clamp((p.energy==null?100:p.energy)+r,0,100);}));}
function drainEnergy(team){activeXI(team).forEach(p=>{p.energy=clamp((p.energy==null?100:p.energy)-rint(20,32),0,100);});}

  y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.name.localeCompare(y.name));}

/* ===================== GENERIC LIVE MATCH ===================== */
function renderMatch(h,a,opts){
 const sim=simulate(h,a);
 el("app").innerHTML=`<div class="panel">
   <div class="scoreboard"><div class="sb-team h">${h.name} ${h.crest}</div>
     <div class="sb-score" id="sb">0 – 0</div><div class="sb-team">${a.crest} ${a.name}</div></div>
   <div class="clock" id="clk">0'</div><div class="commentary" id="cm"></div>
   <div class="between" style="margin-top:12px"><button class="sec" id="skip" onclick="skipMatch()">Hopp til slutt ⏭</button>
   <span class="muted" id="ltag">${opts.tag||'● DIREKTE'}</span></div></div>`;
 let hs=0,as=0,ei=0,minute=0,done=false;const cm=el("cm");
 const add=(c,x)=>{const d=document.createElement("div");d.className="ev "+c;d.innerHTML=x;cm.appendChild(d);cm.scrollTop=cm.scrollHeight;};
 add("sys",`Kampstart! ${h.name} (${h.formation}/${h.mentality}) mot ${a.name} (${a.formation}/${a.mentality}).`);
 function push(e){if(e.type==="goal"){if(e.home)hs++;else as++;el("sb").textContent=`${hs} – ${as}`;
   add("goal",`${e.min}'  ${e.text} <span class="muted">(${hs}–${as})</span>`);}
  else if(e.type==="card")add(e.red?"cardred":"card",`${e.min}'  ${e.text}`);
  else add("chance",`${e.min}'  ${e.text}`);}
 function finish(){if(done)return;done=true;clearInterval(timer);
   el("clk").textContent="Slutt!";el("ltag").textContent="● FULLTID";el("sb").textContent=`${sim.hs} – ${sim.as}`;
   add("sys",`⏱️ Fulltid: ${h.name} ${sim.hs}–${sim.as} ${a.name}.`);
   let winner=null;
   if(opts.knockout&&sim.hs===sim.as){winner=decideDraw(h,a);add("big",`Uavgjort — straffer avgjør! ${winner.name} går videre.`);}
   else add("big",sim.hs>sim.as?`${h.name} vinner!`:sim.hs<sim.as?`${a.name} vinner!`:"Uavgjort.");
   window.__cont=()=>opts.onContinue(sim.hs,sim.as,winner,sim.events);
   el("skip").outerHTML=`<button class="gold" onclick="__cont()">Videre →</button>`;}
 window.skipMatch=()=>{while(ei<sim.events.length)push(sim.events[ei++]);finish();};
 const timer=setInterval(()=>{minute=Math.min(90,minute+2);el("clk").textContent=minute+"'";
   while(ei<sim.events.length&&sim.events[ei].min<=minute)push(sim.events[ei++]);
   if(minute>=90)finish();},190);}
function decideDraw(h,a){const sh=strength(h).attack,sa=strength(a).attack;return Math.random()<sh/(sh+sa)?h:a;}

/* ===================== KALENDER (FIFA-stil) ===================== */
function nextEvent(){return G.eventIdx<G.schedule.length?G.schedule[G.eventIdx]:null;}
function lastPlayedRound(c){return c.done?c.rounds[c.rounds.length-1]:c.rounds[c.round-1];}
window.advanceCalendar=()=>{
 const ev=nextEvent();
 if(!ev)return renderSeasonEnd();
 const days=ev.day-G.day;if(days>0)recoverEnergy(days);G.day=ev.day;
 if(ev.type==='league')playLeagueEvent(ev);
 else if(ev.type==='cup')playCupEvent();
 else if(ev.type==='euro')playEuroEvent();
 else if(ev.type==='uttak')playUttakEvent();
 else playNatBreakEvent();};
function fxList(games){return `<div class="fixtures">${games.map(fx=>{const h=G.teams[fx.h],a=G.teams[fx.a],u=h.isUser||a.isUser;
 return `<div class="fx ${u?'userfx':''}"><span class="t h">${h.name} ${h.crest}</span><span class="res">${fx.hs} – ${fx.as}</span><span class="t">${a.crest} ${a.name}</span></div>`;}).join("")}</div>`;}
function playLeagueEvent(ev){
 const t=userTeam();if(!xiValid(t))autoPickXI(t);const uc=t.country,ud=t.div,r=ev.round;
 for(let ci=0;ci<COUNTRY_DEFS.length;ci++)for(let d=0;d<3;d++){
   G.fixtures[ci][d][r].forEach(fx=>{
     if(ci===uc&&d===ud&&(G.teams[fx.h].isUser||G.teams[fx.a].isUser))return;
     if(!fx.played){const x=simulate(G.teams[fx.h],G.teams[fx.a]);applyResult(fx,x.hs,x.as);
       drainEnergy(G.teams[fx.h]);drainEnergy(G.teams[fx.a]);maybeInjure(G.teams[fx.h]);maybeInjure(G.teams[fx.a]);}});}
 const ug=G.fixtures[uc][ud][r].find(fx=>G.teams[fx.h].isUser||G.teams[fx.a].isUser);
 const done=()=>{G.round=r+1;tickEffects();G.eventIdx++;save();renderEventSummary('league',G.fixtures[uc][ud][r]);};
 if(ug&&!ug.played)renderMatch(G.teams[ug.h],G.teams[ug.a],{onContinue:(hs,as)=>{
   applyResult(ug,hs,as);drainEnergy(G.teams[ug.h]);drainEnergy(G.teams[ug.a]);maybeInjure(G.teams[ug.h]);maybeInjure(G.teams[ug.a]);done();}});
 else done();}
function playKnockoutRound(key,onDone){
 const comp=G.comps[key];if(comp.done){onDone();return;}
 const ties=comp.rounds[comp.round];
 const ut=ties.find(ti=>!ti.played&&!ti.bye&&(isUser(ti.h)||isUser(ti.a)));
 ties.forEach(ti=>{if(ti===ut)return;if(!ti.played&&!ti.bye){
   const r=simulate(G.teams[ti.h],G.teams[ti.a]);ti.hs=r.hs;ti.as=r.as;ti.played=true;
   ti.winner=r.hs>r.as?ti.h:r.as>r.hs?ti.a:decideDraw(G.teams[ti.h],G.teams[ti.a]).id;ti.pens=(r.hs===r.as);
   drainEnergy(G.teams[ti.h]);drainEnergy(G.teams[ti.a]);maybeInjure(G.teams[ti.h]);maybeInjure(G.teams[ti.a]);}});
 if(ut)renderMatch(G.teams[ut.h],G.teams[ut.a],{knockout:true,tag:COMPS[key].icon+' '+COMPS[key].name.toUpperCase(),onContinue:(hs,as,winner)=>{
   ut.hs=hs;ut.as=as;ut.played=true;ut.pens=(hs===as);ut.winner=winner?winner.id:(hs>as?ut.h:ut.a);
   drainEnergy(G.teams[ut.h]);drainEnergy(G.teams[ut.a]);maybeInjure(G.teams[ut.h]);maybeInjure(G.teams[ut.a]);finalizeRound(key);onDone();}});
 else {finalizeRound(key);onDone();}}
function playCupEvent(){if(G.comps.cup.done){G.eventIdx++;return advanceCalendar();}
 playKnockoutRound('cup',()=>{G.eventIdx++;save();renderEventSummary('cup');});}
function playEuroEvent(){
 const uk=userEuroComp();
 ['cl','el','conf'].forEach(k=>{if(k!==uk&&!G.comps[k].done)autoOneRound(k);});
 const fin=()=>{G.eventIdx++;save();renderEventSummary('euro');};

function bracketOrder(n){let r=[1,2];while(r.length<n){const m=r.length*2+1,nx=[];for(const x of r){nx.push(x);nx.push(m-x);}r=nx;}return r;}
function makeTie(h,a){const bye=(h===null||a===null);return {h,a,played:false,hs:0,as:0,winner:bye?(h===null?a:h):null,bye,pens:false};}
function buildKnockout(ids){
 const seeds=[...ids].sort((a,b)=>squadAvg(G.teams[b])-squadAvg(G.teams[a]));
 let size=1;while(size<seeds.length)size*=2;
 const order=bracketOrder(size).map(s=>s<=seeds.length?seeds[s-1]:null);
 const ties=[];for(let i=0;i<size/2;i++)ties.push(makeTie(order[2*i],order[2*i+1]));return ties;}
function buildKnockoutComp(ids){return {round:0,rounds:[buildKnockout(ids)],champion:null,done:false,teamIds:ids.slice()};}
function qualifiedPool(){
 const entries=[];
 COUNTRY_DEFS.forEach((cd,ci)=>{
  let order;
  if(G.lastRanks&&G.lastRanks[ci])order=G.lastRanks[ci];
  else order=G.teams.filter(t=>t.country===ci&&t.div===0).sort((a,b)=>squadAvg(b)-squadAvg(a)).map(t=>t.id);
  order.forEach((id,rank)=>entries.push({id,rank,prestige:cd.prestige||0,str:squadAvg(G.teams[id])}));});
 entries.sort((a,b)=>a.rank-b.rank||b.prestige-a.prestige||b.str-a.str);
 return entries.map(e=>e.id);}
function buildComps(){
 const pool=qualifiedPool();
 const ucIds=G.teams.filter(t=>t.country===G.userCountry).map(t=>t.id);
 return {cup:buildKnockoutComp(ucIds),cl:buildKnockoutComp(pool.slice(0,8)),
   el:buildKnockoutComp(pool.slice(8,16)),conf:buildKnockoutComp(pool.slice(16,24))};}
const roundName=n=>n===1?"Finale":n===2?"Semifinale":n===4?"Kvartfinale":n===8?"Åttedelsfinale":"1. runde";
function renderCompTies(ties){
 return `<div class="fixtures" style="margin-top:8px">${ties.map(ti=>{
  if(ti.bye){const w=G.teams[ti.winner];return `<div class="fx"><span class="t">${w.crest} ${w.name}</span><span class="res muted">frirunde</span><span class="t"></span></div>`;}
  const h=G.teams[ti.h],a=G.teams[ti.a],u=ti.h===G.userTeam||ti.a===G.userTeam;
  const res=ti.played?`${ti.hs}–${ti.as}${ti.pens?' s':''}`:'vs';
  const hw=ti.winner===ti.h,aw=ti.winner===ti.a;
  return `<div class="fx ${u?'userfx':''}"><span class="t h" style="${hw?'color:var(--gold);font-weight:700':''}">${h.name} ${h.crest}</span>
    <span class="res">${res}</span><span class="t" style="${aw?'color:var(--gold);font-weight:700':''}">${a.crest} ${a.name}</span></div>`;}).join("")}</div>`;}
function startKnockoutRound(key){
 const comp=G.comps[key];if(comp.done){key==='cup'?renderCup():renderEuropa();return;}
 const ties=comp.rounds[comp.round];
 const ut=ties.find(ti=>!ti.played&&!ti.bye&&(isUser(ti.h)||isUser(ti.a)));
 ties.forEach(ti=>{if(ti===ut)return;if(!ti.played&&!ti.bye){
   const r=simulate(G.teams[ti.h],G.teams[ti.a]);ti.hs=r.hs;ti.as=r.as;ti.played=true;
   ti.winner=r.hs>r.as?ti.h:r.as>r.hs?ti.a:decideDraw(G.teams[ti.h],G.teams[ti.a]).id;ti.pens=(r.hs===r.as);
   maybeInjure(G.teams[ti.h]);maybeInjure(G.teams[ti.a]);}});
 if(ut)renderMatch(G.teams[ut.h],G.teams[ut.a],{knockout:true,tag:COMPS[key].icon+' '+COMPS[key].name.toUpperCase(),onContinue:(hs,as,winner)=>{
   ut.hs=hs;ut.as=as;ut.played=true;ut.pens=(hs===as);ut.winner=winner?winner.id:(hs>as?ut.h:ut.a);
   maybeInjure(G.teams[ut.h]);maybeInjure(G.teams[ut.a]);advanceKnockout(key);}});
 else advanceKnockout(key);}
function finalizeRound(key){const comp=G.comps[key],ties=comp.rounds[comp.round],w=ties.map(ti=>ti.winner);
 if(w.length===1){comp.champion=w[0];comp.done=true;awardComp(key);return;}
 const nx=[];for(let i=0;i<w.length;i+=2)nx.push(makeTie(w[i],w[i+1]));comp.rounds.push(nx);comp.round++;}

 if(comp.champion===G.userTeam){userTeam().budget+=prize;G.news.push(COMPS[key].icon+" Du vant "+(key==='cup'?userCountryName()+"-"+COMPS[key].name:COMPS[key].name)+"! +"+kr(prize)+".");}
 else if(key!=='conf'&&key!=='el')G.news.push(COMPS[key].icon+" "+champ.name+" vant "+(key==='cup'?"cupen":COMPS[key].name)+".");}

   ti.hs=r.hs;ti.as=r.as;ti.played=true;ti.winner=r.hs>r.as?ti.h:r.as>r.hs?ti.a:decideDraw(G.teams[ti.h],G.teams[ti.a]).id;ti.pens=(r.hs===r.as);}});
 finalizeRound(key);}

function natStrength(n){const xi=bestXI(n.squad,"4-4-2");return xi.length?xi.reduce((s,p)=>s+eff(p),0)/xi.length:50;}
function natScore(p){return p.rating+(p.form||0)*3+(p.goals||0)*3;}
function clubMap(){const m=new Map();G.teams.forEach(t=>t.squad.forEach(p=>m.set(p.id,t.crest+' '+t.name)));return m;}
function snapOf(p,club){return {id:p.id,name:p.name,pos:p.pos,rating:p.rating,age:p.age,energy:p.energy,form:p.form||0,goals:p.goals||0,caps:p.caps||0,natGoals:p.natGoals||0,club:club||'—',injury:0,inXI:false};}
function natPool(idx){return G.teams.flatMap(t=>t.squad).filter(p=>p.nat===idx&&fit(p)).sort((a,b)=>natScore(b)-natScore(a));}
function playerById(id){for(const t of G.teams){const p=t.squad.find(x=>x.id===id);if(p)return p;}return null;}
function applyManualNat(un){
 const byId=new Map(),club=clubMap();G.teams.forEach(t=>t.squad.forEach(p=>byId.set(p.id,p)));
 const sq=[],used=new Set(),ids=[];
 (G.natSquadIds||[]).forEach(id=>{const p=byId.get(id);if(p&&fit(p)&&p.nat===G.userNation&&!used.has(id)&&sq.length<NAT_SQUAD_SIZE){used.add(id);sq.push(snapOf(p,club.get(id)));ids.push(id);}});
 G.natSquadIds=ids;un.squad=sq;
 const xiset=new Set(G.natXIids||[]);un.squad.forEach(s=>s.inXI=xiset.has(s.id));
 un.squad.forEach(s=>s.captain=(G.natCaptain!=null&&s.id===G.natCaptain));
 if(!un.squad.some(s=>s.captain)){const cb=un.squad.slice().sort((a,b)=>b.rating-a.rating)[0];if(cb)cb.captain=true;}}
function natSeedStrength(idx){const xi=bestXI(natPool(idx),"4-4-2");return xi.length?xi.reduce((s,p)=>s+p.rating,0)/xi.length:50;}
function canFieldNat(n){return bestXI(n.squad,n.formation).length===11;}
function assignNationalities(teams){

function selectNationalSquads(){
 const N=NATIONS.length,club=clubMap();

 const pools=Array.from({length:N},()=>[]);
 G.teams.forEach(t=>t.squad.forEach(p=>{if(p.nat!=null&&p.nat>=0&&p.nat<N&&fit(p))pools[p.nat].push(p);}));
 const need=NAT_NEED;
 nations.forEach((nat,i)=>{
   for(const pos of ["GK","DF","MF","FW"]){
     pools[i].filter(p=>p.pos===pos).sort((a,b)=>natScore(b)-natScore(a)).slice(0,need[pos])
       .forEach(p=>nat.squad.push({id:p.id,name:p.name,pos:p.pos,rating:p.rating,age:p.age,energy:p.energy,form:p.form||0,goals:p.goals||0,club:club.get(p.id)||'—',injury:0,inXI:false}));
     let have=nat.squad.filter(p=>p.pos===pos).length;
     while(have<need[pos]){nat.squad.push({name:pick(FIRST)+" "+pick(LAST),pos,rating:rint(55,68),age:rint(20,32),energy:100,form:0,goals:0,club:'—',injury:0,inXI:false});have++;}}
   const cb=nat.squad.slice().sort((a,b)=>b.rating-a.rating)[0];if(cb)cb.captain=true;
 });
 if(G.userNation!=null&&nations[G.userNation]){nations[G.userNation].isUser=true;applyManualNat(nations[G.userNation]);}

function nationsByScope(scope){return scope==='global'?G.nations.map(n=>n.__idx):G.nations.filter(n=>n.con===scope).map(n=>n.__idx);}
function makeNatTie(h,a){const bye=(h==null||a==null);return {h,a,played:false,hs:0,as:0,winner:bye?(h==null?a:h):null,bye,pens:false};}
function buildKOComp(key,name,icon,scope,size){
 let pool=nationsByScope(scope).sort((a,b)=>natSeedStrength(b)-natSeedStrength(a));
 let parts=pool.slice(0,Math.min(size,pool.length));
 const inScope=scope==='global'||NATIONS[G.userNation].con===scope;
 if(inScope&&!parts.includes(G.userNation)&&parts.length)parts[parts.length-1]=G.userNation;
 parts=Array.from(new Set(parts)).sort((a,b)=>natSeedStrength(b)-natSeedStrength(a));
 let psize=1;while(psize<parts.length)psize*=2;
 const order=bracketOrder(psize).map(x=>x<=parts.length?parts[x-1]:null);
 const ties=[];for(let i=0;i<psize/2;i++)ties.push(makeNatTie(order[2*i],order[2*i+1]));
 return {kind:'ko',key,name,icon,scope,round:0,rounds:[ties],champion:null,done:false,totalRounds:Math.round(Math.log2(psize)),cur:null};}
function buildQualComp(key,name,icon,scope){
 const pool=nationsByScope(scope).filter(i=>i!==G.userNation).sort((a,b)=>natSeedStrength(b)-natSeedStrength(a));
 const grp=[G.userNation];for(let k=0;k<4&&k<pool.length;k++)grp.push(pool[k]);
 while(grp.length<5)grp.push(pool[(grp.length+2)%Math.max(pool.length,1)]||G.userNation);
 const fixtures=[
  {user:[grp[0],grp[1]],other:[grp[2],grp[3]]},
  {user:[grp[0],grp[2]],other:[grp[3],grp[4]]},
  {user:[grp[0],grp[3]],other:[grp[4],grp[1]]},
  {user:[grp[0],grp[4]],other:[grp[1],grp[2]]}];
 const table={};grp.forEach(i=>table[i]={w:0,d:0,l:0,gf:0,ga:0,pts:0});
 return {kind:'qual',key,name,icon,scope,group:grp,fixtures,md:0,table,done:false,qualified:false,qualPos:0,cur:null};}

 let plays=true;
 if(isComp&&I.kind==='ko')plays=!I.done&&!!I.rounds[I.round].find(t=>!t.bye&&(t.h===G.userNation||t.a===G.userNation));
 if(!plays){G.eventIdx++;return advanceCalendar();}
 G.nations=selectNationalSquads();
 renderNatUttak();}
function renderNatUttak(){
 natCtx='uttak';
 const n=G.nations[G.userNation],lab=natUttakLabel();
 el("app").innerHTML=`
 <div class="panel"><div class="muted" style="margin-bottom:6px">📅 Dag ${G.day} · ${dateStr(G.day)} · 📣 Innkalling til landslagssamling</div>
   <div class="between"><h2 style="margin:0;border:none;padding:0">📋 Ta ut troppen — ${lab.title}</h2>
     <button class="gold" onclick="natUttakDone()">Bekreft tropp →</button></div>
   <div class="note">${n.flag} ${n.name}${lab.opp?` møter <b>${lab.opp.flag} ${lab.opp.name}</b> i samlingen`:''}. Velg troppen (eksakt ${NAT_SQUAD_SIZE} spillere) — den brukes i samlingen.</div>
   <div class="row" style="gap:14px;margin-top:4px">
     <div style="flex:1;min-width:150px"><label>Formasjon</label><select onchange="setNatTactic('formation',this.value)">${Object.keys(FORMATIONS).map(x=>`<option ${n.formation===x?'selected':''}>${x}</option>`).join("")}</select></div>
     <div style="flex:1;min-width:150px"><label>Mentalitet</label><select onchange="setNatTactic('mentality',this.value)">${Object.keys(MENTALITY).map(x=>`<option ${n.mentality===x?'selected':''}>${x}</option>`).join("")}</select></div></div></div>
 <div class="panel"><h2>📋 Landslagsuttak — ta ut laget selv</h2>${natSquadPanel()}</div>`;}
window.natUttakDone=()=>{G.eventIdx++;save();advanceCalendar();};
function playNatBreakEvent(){
 G.nations=selectNationalSquads();
 if(G.intlBreak==null)G.intlBreak=0;
 const I=G.intl,bi=G.intlBreak;
 const tr=I.totalRounds||(I.rounds?Math.round(Math.log2(I.rounds[0].length*2)):4);
 const isComp=I.kind==='ko'?bi<tr:bi<I.fixtures.length;
 if(!isComp){I.cur={kind:'friendly',opp:randomOppNat()};renderNatBreak();return;}
 if(I.kind==='qual'){I.cur={kind:'qual',opp:I.fixtures[I.md].user[1]};renderNatBreak();return;}
 if(!I.done){const ties=I.rounds[I.round];
   const ut=ties.find(t=>!t.bye&&!t.played&&(t.h===G.userNation||t.a===G.userNation));
   if(ut){I.cur={kind:'ko',opp:ut.h===G.userNation?ut.a:ut.h};renderNatBreak();return;}
   ties.forEach(t=>{if(!t.played&&!t.bye)simNatTie(t);});finalizeKO(I);}
 I.cur={kind:'ko-auto'};G.intlBreak++;G.eventIdx++;save();renderEventSummary('natbreak');}
function renderNatBreak(){
 natCtx='break';
 const I=G.intl,n=G.nations[G.userNation],cur=I.cur,opp=G.nations[cur.opp];
 const label=cur.kind==='ko'?`${I.icon} ${I.name} — ${roundName(I.rounds[I.round].length)}`:cur.kind==='qual'?`🎫 ${I.name} — kamp ${I.md+1}/4`:'🤝 Treningskamp';
 el("app").innerHTML=`
 <div class="panel"><div class="muted" style="margin-bottom:6px">📅 Dag ${G.day} · ${dateStr(G.day)} · 🌍 Landslagspause</div>
   <div class="between"><h2 style="margin:0;border:none;padding:0">${label}</h2>
     ${canFieldNat(n)?`<button class="gold" onclick="startNatBreakMatch()">Spill kamp →</button>`:`<button class="sec" disabled>Velg laget først</button>`}</div>
   <div class="note">${n.flag} ${n.name} mot <b>${opp.flag} ${opp.name}</b> (motstander snitt ${Math.round(natStrength(opp))}). ${cur.kind==='friendly'?'Treningskamp — ingen turneringskamp denne pausen.':''} Hak av troppen under.</div>
   <div class="row" style="gap:14px;margin-top:4px">
     <div style="flex:1;min-width:150px"><label>Formasjon</label><select onchange="setNatTacticBreak('formation',this.value)">${Object.keys(FORMATIONS).map(x=>`<option ${n.formation===x?'selected':''}>${x}</option>`).join("")}</select></div>
     <div style="flex:1;min-width:150px"><label>Mentalitet</label><select onchange="setNatTacticBreak('mentality',this.value)">${Object.keys(MENTALITY).map(x=>`<option ${n.mentality===x?'selected':''}>${x}</option>`).join("")}</select></div></div></div>
 <div class="panel"><h2>📋 Landslagsuttak — ta ut laget selv</h2>${natSquadPanel()}</div>`;}
function resolveNatBreak(cur,hs,as,w){
 const I=G.intl;
 if(cur.kind==='ko'){const ties=I.rounds[I.round];const ut=ties.find(t=>!t.played&&(t.h===G.userNation||t.a===G.userNation));
   if(ut){ut.hs=hs;ut.as=as;ut.played=true;ut.pens=(hs===as);ut.winner=w?(w===G.nations[ut.h]?ut.h:ut.a):(hs>as?ut.h:ut.a);}
   ties.forEach(t=>{if(!t.played&&!t.bye)simNatTie(t);});finalizeKO(I);}
 else if(cur.kind==='qual'){const f=I.fixtures[I.md];recordQual(I,f.user[0],f.user[1],hs,as);
   if(f.other){const r=simulate(G.nations[f.other[0]],G.nations[f.other[1]]);recordQual(I,f.other[0],f.other[1],r.hs,r.as);}
   I.md++;if(I.md>=I.fixtures.length){I.done=true;finalizeQual(I);}}
 else{const res=G.nations[G.userNation].name+' '+hs+'–'+as+' '+G.nations[cur.opp].name;I.cur.result=res;G.news.push('🤝 Treningskamp: '+res+'.');}}
window.startNatBreakMatch=()=>{
 const I=G.intl,cur=I.cur,me=G.nations[G.userNation],opp=G.nations[cur.opp];
 const ko=cur.kind==='ko';
 const tag=ko?I.icon+' '+I.name.toUpperCase():cur.kind==='qual'?'🎫 '+I.name.toUpperCase():'🤝 TRENINGSKAMP';
 renderMatch(me,opp,{knockout:ko,tag,onContinue:(hs,as,w,events)=>{applyNatStats(events);resolveNatBreak(cur,hs,as,w);G.intlBreak++;G.eventIdx++;save();renderEventSummary('natbreak');}});};

/* ===================== UNGDOMSAKADEMI ===================== */
function makeYouth(level,base){
 const pos=pick(["GK","DF","DF","MF","MF","MF","FW","FW"]),age=rint(16,18);
 const rating=clamp(Math.round(rnd(42,52)+level*2+(base?base*0.12:0)),40,68);
 const p={id:PID++,name:pick(FIRST)+" "+pick(LAST),pos,age,rating,
   potential:clamp(rating+rint(12,28),rating,92),contract:rint(2,3),form:0,injury:0,goals:0,energy:100,nat:rint(0,NATIONS.length-1),youth:true,inXI:false};
 p.value=playerValue(p);p.wage=wageFor(p.value);return p;}
function generateYouthIntake(){
 const lvl=G.academy.level,n=rint(2,4);
 for(let i=0;i<n;i++)G.academy.prospects.push(makeYouth(lvl,userTeam().base));
 if(G.academy.prospects.length>8)G.academy.prospects=G.academy.prospects.slice(-8);}
function renderAcademy(){
 const t=userTeam(),ac=G.academy,cost=ac.level*3e6,canInvest=t.budget>=cost&&ac.level<5;
 el("app").innerHTML=nav('aca')+`
 <div class="panel"><div class="row">
   <div class="stat"><div class="k">Akademinivå</div><div class="v gold">${ac.level}/5 ${"★".repeat(ac.level)}</div></div>
   <div class="stat"><div class="k">Budsjett</div><div class="v good">${kr(t.budget)}</div></div>
   <div class="stat"><div class="k">Talenter</div><div class="v">${ac.prospects.length}</div></div>
   <div class="stat" style="flex:2"><div class="k">Invester for bedre talenter</div>
     <button class="${canInvest?'gold':'sec'}" ${canInvest?'':'disabled'} onclick="investAcademy()" style="margin-top:4px">${ac.level<5?'Oppgrader · '+kr(cost):'Maks nivå'}</button></div></div>
 <div class="note">🎓 Akademiet henter inn nye talenter hver sesong. Høyere nivå gir høyere rating og potensial. Forfrem dem til A-laget når de er klare.</div></div>
 <div class="panel"><h2>Talenter</h2>
 ${ac.prospects.length?`<div class="scroll"><table><thead><tr><th>Talent</th><th class="c">Pos</th><th class="c">Alder</th><th class="c">OVR</th><th class="c">POT</th><th class="c">Verdi</th><th></th></tr></thead><tbody>
   ${ac.prospects.map(p=>`<tr><td>${p.name}</td><td class="c">${posPill(p)}</td><td class="c ageY">${p.age}</td><td class="c ovr">${p.rating}</td><td class="c" style="color:var(--gold)">${p.potential}</td><td class="c">${kr(p.value)}</td>
     <td class="c"><button class="tiny" onclick="promoteProspect(${p.id})">Forfrem</button></td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">Ingen talenter akkurat nå — kom tilbake neste sesong.</p>'}</div>`;}
window.investAcademy=()=>{const t=userTeam(),ac=G.academy,cost=ac.level*3e6;
 if(t.budget>=cost&&ac.level<5){t.budget-=cost;ac.level++;G.news.push("🎓 Akademiet oppgradert til nivå "+ac.level+".");save();renderAcademy();}};
window.promoteProspect=id=>{const t=userTeam(),ac=G.academy,i=ac.prospects.findIndex(p=>p.id===id);if(i<0)return;
 if(t.squad.length>=25){alert("Troppen er full (maks 25).");return;}
 const p=ac.prospects.splice(i,1)[0];p.youth=false;t.squad.push(p);autoPickXI(t);
 G.news.push("🌟 Forfremmet "+p.name+" fra akademiet til A-laget.");save();renderAcademy();};

/* ===================== BOOT ===================== */
renderSetup();
</script>
